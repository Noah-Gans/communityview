<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to CommunityView...</title>
    <!-- 301 Redirect - Preserves SEO value -->
    <meta http-equiv="refresh" content="0; url=https://communityview.ai">
    <link rel="canonical" href="https://communityview.ai">
    
    <!-- JavaScript redirect as fallback -->
    <script>
        // Preserve path and query string
        var newUrl = "https://communityview.ai" + window.location.pathname + window.location.search + window.location.hash;
        window.location.replace(newUrl);
    </script>
</head>
<body>
    <p>Redirecting to <a href="https://communityview.ai">communityview.ai</a>...</p>
</body>
</html>
